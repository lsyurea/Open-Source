name: Update open source board

on:
  schedule:
    - cron: "17 2 * * *" # daily at 02:17 UTC (off the hour to dodge GitHub's cron backlog)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - board.config.json
      - scripts/**
      - .github/workflows/update-board.yml
  # Other repos run this same job with:
  #   uses: lsyurea/Open-Source/.github/workflows/update-board.yml@main
  workflow_call:
    inputs:
      layout:
        description: "full (card + PR table + dashboard data) or profile (card only)"
        type: string
        default: full

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: update-board
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      # The scanner lives in lsyurea/Open-Source; check it out on its own so
      # callers in other repos run the same script and default config.
      - uses: actions/checkout@v5
        with:
          repository: lsyurea/Open-Source
          path: .board

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Scan pull requests
        run: node .board/scripts/update-board.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOARD_ROOT: ${{ github.workspace }}
          BOARD_LAYOUT: ${{ inputs.layout || 'full' }}

      - name: Commit board changes
        run: |
          if [ -z "$(git status --porcelain -- . ':!.board')" ]; then
            echo "Board unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.board'
          git commit -m "chore: update open source board"
          git push
