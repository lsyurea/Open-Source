name: Update open source board

on:
  schedule:
    - cron: "17 2 * * *" # daily at 02:17 UTC (off the hour to dodge GitHub's cron backlog)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - board.config.json
      - scripts/**
      - .github/workflows/update-board.yml

permissions:
  contents: write

concurrency:
  group: update-board
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Scan pull requests
        run: node scripts/update-board.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit board changes
        run: |
          if [ -z "$(git status --porcelain -- README.md docs)" ]; then
            echo "Board unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs
          git commit -m "chore: update open source board"
          git push
